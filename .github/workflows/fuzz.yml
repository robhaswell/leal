name: Fuzz

# `just fuzz` for each cargo-fuzz target (fuzz/fuzz_targets/, PLAN 2.7,
# DESIGN §5 test layer 4), nightly or by hand: `gh workflow run fuzz.yml`
# (optionally `-f seconds=1800`). A crash or a mismatch with the testkit's
# oracle fails the target's job and uploads the input that caused it; turn
# it into a test in the normal suite (`cargo fuzz run <target> <file>`
# reproduces it locally).
on:
  schedule:
    # 02:41 UTC, away from the top of the hour and from the deep tests
    # (03:17), so the two don't queue for runners together.
    - cron: "41 2 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: "How long to fuzz each target, in seconds (at most about 2,400: the job times out at 45 minutes)"
        default: "600"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One runner per target, each fuzzing for 10 minutes, in parallel. A job
  # takes about 15 minutes with the build; the timeout leaves room for a
  # longer manual run. macOS, as leal-core's documents need APFS clones and
  # extended attributes.
  fuzz:
    name: just fuzz ${{ matrix.target }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      # Every target runs to the end, so one night reports every crash.
      fail-fast: false
      matrix:
        target: [index, detect, rows, serialize, encodings]
    steps:
      - uses: actions/checkout@v7

      # cargo-fuzz's sanitizer flags need nightly Rust, for this job only;
      # everything else builds with the toolchain in rust-toolchain.toml.
      - name: Install Rust toolchains
        run: |
          rustup toolchain install
          rustup toolchain install nightly --profile minimal
          rustup show

      - name: Install just and cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-fuzz

      # The fuzz crate builds with nightly, so the cache is keyed on it.
      - uses: Swatinem/rust-cache@v2
        env:
          RUSTUP_TOOLCHAIN: nightly
        with:
          workspaces: fuzz
          key: ${{ matrix.target }}

      # The corpus each night grows, kept between runs, so fuzzing picks
      # up where the last night stopped. Seeds come from tests/corpus.
      - name: Restore the corpus
        uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        env:
          SECONDS_EACH: ${{ inputs.seconds || '600' }}
        run: just fuzz "${{ matrix.target }}" "$SECONDS_EACH"

      - name: Save the corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      - name: Upload crash artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          retention-days: 90
          if-no-files-found: ignore
