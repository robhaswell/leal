name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on `main` are never
# cancelled, so every landed commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: just check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the channel, components and targets in rust-toolchain.toml.
      # Since rustup 1.28, `rustup show` alone no longer installs a missing
      # toolchain, so install it explicitly, then print what is active.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      # After the toolchain step, because the cache key includes the rustc version.
      - uses: Swatinem/rust-cache@v2

      - run: just check

  # The whole pipeline: Rust core -> UniFFI -> Swift bindings -> Leal.app,
  # plus the XCTest suite that calls Rust through the bindings (task 0.3).
  # This repeats `just check`, so a Rust failure also fails this job; the
  # `check` job above stays as the quicker signal.
  check-all:
    name: just check-all
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # The app needs Swift 6 language mode (Xcode 16 or later) and builds for
      # macOS 14. Select the newest stable Xcode on the runner instead of
      # relying on the image default, then fail early if it is too old.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check Xcode version
        run: |
          xcodebuild -version
          swift --version
          major="$(xcodebuild -version | awk 'NR == 1 { split($2, v, "."); print v[1] }')"
          if [ "$major" -lt 16 ]; then
            echo "::error::Xcode $major is too old; Swift 6 mode needs Xcode 16 or later"
            exit 1
          fi

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen
          xcodegen --version

      - uses: Swatinem/rust-cache@v2

      - run: just check-all

      # `check-all` builds Debug for the runner's architecture only. Also
      # build the universal (arm64 + x86_64) Release app, with the Rust
      # release profile, so the shipping configuration is always checked.
      - name: Build universal Release app
        run: |
          just app release
          binary=build/DerivedData/Build/Products/Release/Leal.app/Contents/MacOS/Leal
          lipo -info "$binary"
          lipo "$binary" -verify_arch arm64
          lipo "$binary" -verify_arch x86_64

      # On failure, keep the xcodebuild logs and test results for debugging.
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-logs
          path: |
            build/*.log
            build/*.xcresult
          if-no-files-found: ignore
