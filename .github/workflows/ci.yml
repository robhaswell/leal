name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on `main` are never
# cancelled, so every landed commit gets a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

# Runners and Xcode are pinned, so CI's compiler and SDK change only with a
# commit (docs/tasks/0.3.md, "Toolchain"). The Rust-only job uses the GA
# macOS 26 image. The app job uses `xcode-27`, GitHub's image with Xcode 27
# (a public preview as of October 2026), to match local development. If that
# image is withdrawn or queues badly, fall back to `macos-26` with Xcode 26.6.
#
# Each job has a timeout, so a hang (a stuck `hdiutil` or test host) fails
# the job instead of holding the runner for GitHub's 6-hour default. At
# 646c9d6, `check` took about 2 minutes and `check-all` about 7, with a warm
# cache. nextest also kills a single test after 5 minutes
# (.config/nextest.toml).
jobs:
  check:
    name: just check
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Installs the channel, components and targets in rust-toolchain.toml.
      # Since rustup 1.28, `rustup show` alone no longer installs a missing
      # toolchain, so install it explicitly, then print what is active.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      # After the toolchain step, because the cache key includes the rustc version.
      - uses: Swatinem/rust-cache@v2

      - run: just check

  # The whole pipeline: Rust core -> UniFFI -> Swift bindings -> Leal.app,
  # plus the XCTest suite that calls Rust through the bindings (task 0.3).
  # This repeats `just check`, so a Rust failure also fails this job; the
  # `check` job above stays as the quicker signal.
  check-all:
    name: just check-all
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      # The Xcode the app is built and tested with. Change it deliberately,
      # together with README.md and docs/tasks/0.3.md.
      LEAL_XCODE_VERSION: "27.0"
    steps:
      - uses: actions/checkout@v7

      # Select the pinned Xcode explicitly rather than the image default,
      # which can change without a commit.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.LEAL_XCODE_VERSION }}

      - name: Check Xcode version
        run: |
          xcodebuild -version
          swift --version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"
          version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          if [ "$version" != "$LEAL_XCODE_VERSION" ]; then
            echo "::error::expected Xcode $LEAL_XCODE_VERSION, got $version"
            exit 1
          fi

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show

      - name: Install just and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          brew install xcodegen
          xcodegen --version

      - uses: Swatinem/rust-cache@v2

      - run: just check-all

      # The build with the scripted runs (`LEAL_BENCH`: the scroll bench,
      # `just perf`'s hooks and `just snapshot`), with zero warnings. Nothing
      # else compiles that code, so without this it could break unnoticed
      # until someone next measures or takes screenshots. A build only; it
      # reuses the debug library `check-all` just built.
      - name: Build the scripted-run app
        run: just _app-scripted debug

      # The XCTest suite again, against the Rust release profile and the
      # Release configuration. Among other things, this checks that a Rust
      # panic is still caught in the release profile (`panic = "unwind"`).
      - name: Test against the release profile
        run: just app-test release

      # Every other xcodebuild here runs through `just`, which builds the Rust
      # side first and tells the RustFFI target to skip. This one builds the
      # way the Xcode IDE does: no generated bindings yet, a minimal PATH, and
      # the RustFFI target running `just ffi` itself.
      - name: Build like the Xcode IDE
        run: just ide-build

      # `check-all` builds Debug for the runner's architecture only. Also
      # build the universal (arm64 + x86_64) Release app, with the Rust
      # release profile, so the shipping configuration is always checked.
      # This runs after `app-test release`, which linked the release library
      # with leal-ffi's test-only exports, so check that they are gone. Plain
      # `nm` (not `-gU`, which skips hidden symbols) and `strings`, which also
      # sees UniFFI's metadata names.
      - name: Build universal Release app
        run: |
          just app release
          contents=build/DerivedData/Build/Products/Release/Leal.app/Contents
          for binary in "$contents/MacOS/Leal" "$contents/Frameworks/LealFFI.framework/LealFFI"; do
            lipo -info "$binary"
            lipo "$binary" -verify_arch arm64
            lipo "$binary" -verify_arch x86_64
          done
          # Nor leal-ffi's test-only exports, or leal-core's test hooks.
          just check-no-test-exports
          # Nor the scripted runs (the bench and snapshot hooks, LEAL_BENCH).
          just check-no-bench

      # On failure, keep the xcodebuild logs and test results for debugging.
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-logs
          path: |
            build/*.log
            build/*.xcresult
          if-no-files-found: ignore
