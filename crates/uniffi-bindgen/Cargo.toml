[package]
name = "uniffi-bindgen"
description = "UniFFI's bindings generator, built from this workspace. `just ffi` runs it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "uniffi-bindgen"
path = "src/main.rs"

[dependencies]
# `cli` adds the command-line generator, and `cargo-metadata` lets library
# mode find each crate's (optional) `uniffi.toml`. Only this tool needs them;
# leal-ffi depends on `uniffi` without either.
uniffi = { workspace = true, features = ["cli", "cargo-metadata"] }

[lints]
workspace = true
