[package]
name = "leal-core"
description = "Leal's CSV engine: reading, indexing, editing and saving."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Decoding the single-byte encodings Leal supports (DESIGN §3.2, ADR-0005
# decision 5): whether bytes decode under an attribute's encoding, the text
# the header heuristic looks at (1.2), and display values (1.4).
encoding_rs.workspace = true
# The `source` module (PLAN 1.1): `fclonefileat`, `fgetxattr` and `fcntl`,
# which the standard library doesn't wrap. memmap2 already depends on it.
libc = "0.2.189"
# The `source` module: the read-only memory map of the clone (DESIGN §3.1).
memmap2 = "0.9.11"
# The row index (PLAN 1.3): finding quote, CR and LF bytes (DESIGN §3.3).
memchr = "2.8.3"

[dev-dependencies]
leal-testkit.workspace = true
proptest.workspace = true

[lints]
workspace = true
