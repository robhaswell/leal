[package]
name = "leal-ffi"
description = "Swift bindings for leal-core."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# `staticlib` is the `.a` file linked into Leal.app, and it is the only crate
# type. Adding `lib` (an rlib) would turn off release LTO for this crate:
# Cargo passes `-C lto` only when every crate type of a build supports it, and
# rlibs don't, so the shipped `.a` would silently lose the workspace's
# `lto = "thin"`. This crate's unit tests don't need an rlib (`cargo test`
# builds them as a test binary), and no other crate depends on leal-ffi. If
# one ever must (for example, integration tests in `tests/`), keep this line
# and build the shipped slice with
# `cargo rustc -p leal-ffi --lib --crate-type staticlib` instead.
crate-type = ["staticlib"]
# Doctests link against an rlib, so rustdoc can't run them for a
# staticlib-only crate; this says so explicitly. Examples belong in leal-core,
# which this crate only wraps. (`cargo test --workspace --doc` still prints
# "doc tests are not supported for crate type(s) `staticlib`" for this crate.
# The warning is harmless; `--exclude leal-ffi` silences it.)
doctest = false

[features]
# Test-only exports (`debug_panic`) for the app's XCTest suite. `just ffi`
# turns it on for debug builds and for `just app-test release`; the release
# library that `just app release` links never has it. It turns on
# leal-core's test hooks, for `debug_open_document_with_fault` (task 1.7:
# a removable drive disconnecting, or its file changing, in the app's tests).
test-exports = ["leal-core/test-hooks"]

[dependencies]
leal-core.workspace = true
uniffi.workspace = true
# `sysctlbyname`, for the number of performance cores (the scheduler's pool
# size, DESIGN §3.10 rule 4). Already a dependency of leal-core.
libc = "0.2.189"

[lints]
workspace = true
