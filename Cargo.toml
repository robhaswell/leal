[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
# Keep in step with the channel in rust-toolchain.toml.
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/robhaswell/leal"
publish = false

[workspace.dependencies]
leal-core = { path = "crates/leal-core" }
# Swift bindings for leal-ffi (task 0.3). `crates/uniffi-bindgen` must use the
# same version, which it does by inheriting this line. The default feature
# (`cargo-metadata`) is only for the bindings generator, so it is off here and
# `crates/uniffi-bindgen` turns it back on; the library built into the app
# doesn't compile `cargo_metadata` and `serde_json`.
uniffi = { version = "0.32.2", default-features = false }
# Dev-only: add as `leal-testkit.workspace = true` under `[dev-dependencies]`.
leal-testkit = { path = "crates/leal-testkit" }
# Default features off: `fork` and `timeout` pull in `rusty-fork` and
# `tempfile`, which nextest (one process per test) makes unnecessary.
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
# Single-byte and UTF-16 decoding (WHATWG Encoding Standard), task 1.2.
encoding_rs = "0.8.42"

# Every crate opts in with `[lints] workspace = true`.
[workspace.lints.rust]
# `unsafe` is allowed only in leal-core's `source` module (mmap) and in
# leal-ffi (CLAUDE.md). This is `deny` rather than `forbid` so that those
# tasks can add a narrow `#[allow(unsafe_code)]` on exactly that module or
# crate; `forbid` could not be overridden.
unsafe_code = "deny"
# Only public items and the crate root need docs, so in practice this applies
# to the library crates (leal-core, leal-ffi). For leal-cli it only asks for
# the crate doc comment. `just check` runs clippy with `-D warnings`, so this
# is enforced.
missing_docs = "warn"

[workspace.lints.clippy]
# The default clippy lints (correctness, suspicious, style, complexity, perf).
# Priority -1 lets the individual lints below override the group.
all = { level = "warn", priority = -1 }

# A selection from `clippy::pedantic`. The whole group is noisy (for example
# `must_use_candidate`, `module_name_repetitions`, `doc_markdown`,
# `similar_names`), so we enable only the lints that catch real bugs or real
# costs in this kind of code: byte offsets, u32 indexes, FFI and hot loops.
#
# Numeric casts: the row index stores `u32` offsets (DESIGN §3.3). A silent
# `as` truncation or sign change is a data bug, so make every lossy cast
# explicit (`u32::try_from`) and every lossless one visible (`u64::from`).
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cast_lossless = "warn"
checked_conversions = "warn"
# Float comparison: numeric-aware sort and filters (DESIGN §3.8).
float_cmp = "warn"
# Pointer casts: leal-ffi and the mmap source.
ptr_as_ptr = "warn"
borrow_as_ptr = "warn"
# Needless copies and moves on hot paths.
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
large_types_passed_by_value = "warn"
large_stack_arrays = "warn"
inefficient_to_string = "warn"
implicit_clone = "warn"
# `.csv` vs `.CSV`: file names come from users.
case_sensitive_file_extension_comparisons = "warn"
# Public API documentation for leal-core.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
# Readability.
wildcard_imports = "warn"
unnecessary_wraps = "warn"
unused_self = "warn"
unused_async = "warn"

# `unsafe` (CLAUDE.md): every `unsafe` block needs a `// SAFETY:` comment
# saying why it is sound. Clippy checks that the comment is there, though not
# what it says. Macro-generated code from other crates (UniFFI's scaffolding)
# isn't checked.
undocumented_unsafe_blocks = "warn"
# ...and that each `unsafe` block holds one unsafe operation, so that each
# SAFETY comment covers exactly one thing.
multiple_unsafe_ops_per_block = "warn"

# No `unwrap` or `expect` in product code. A panic in leal-core or leal-ffi
# either crashes the app (an export that can't fail is called with `try!`) or
# turns into an unexplained internal error, so product code returns errors
# instead. These are turned on at the crate roots of the product crates
# (leal-core, leal-ffi, leal-cli) with `#![warn(clippy::unwrap_used,
# clippy::expect_used)]`, not here: leal-testkit and test code use them
# freely, and a crate can't add lints on top of `[lints] workspace = true`.
# `clippy.toml` allows them in `#[test]` functions and `#[cfg(test)]` modules.

[profile.release]
lto = "thin"
codegen-units = 1
# `panic` stays at the default ("unwind"). UniFFI (task 0.3) catches Rust
# panics at the FFI boundary. For exports that return `Result` (Swift
# `throws`), a panic becomes a catchable Swift error; exports that can't fail
# are called with `try!` and still crash. With `panic = "abort"` no panic
# could be caught at all.
