# XcodeGen spec for Leal.app. `just xcodeproj` (and `just app`, `just run`,
# `just app-test`) generate app/Leal.xcodeproj from this file. The project is
# git-ignored: edit this file, not the project.
#
# The Rust side comes from `just ffi`. The `just` recipes run it before
# xcodebuild; builds from the Xcode IDE run it through the RustFFI target
# below. It produces:
#   - target/universal/<profile>/libleal_ffi.a  universal static library
#   - app/Generated/leal_ffi.swift              Swift bindings
#   - app/Generated/leal_ffiFFI.h               C header for the library
#   - app/Generated/leal_ffiFFI.modulemap       Clang module `leal_ffiFFI`
# See docs/tasks/0.3.md for how these fit together.

name: Leal

options:
  bundleIdPrefix: io.github.robhaswell
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Zero warnings. The `just` recipes also fail on linker warnings.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # Ad hoc signing ("-"): the app runs on this Mac without an Apple
    # Developer account. Developer ID signing arrives with PLAN 4.5.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

    # --- The Rust library ---------------------------------------------------
    # Link target/universal/<profile>/libleal_ffi.a. There is only a `.a` in
    # that directory, so `-l` can't pick up a dylib by accident. The linker
    # records the files it read and Xcode relinks when they change.
    LEAL_FFI_LIBRARY_DIR: $(PROJECT_DIR)/../target/universal/$(LEAL_RUST_PROFILE)
    LIBRARY_SEARCH_PATHS: $(inherited) $(LEAL_FFI_LIBRARY_DIR)
    OTHER_LDFLAGS: $(inherited) -lleal_ffi
    # The generated Swift file does `import leal_ffiFFI`, a Clang module for
    # the C header. Point Clang at its module map directly, so no renaming or
    # bridging header is needed.
    OTHER_SWIFT_FLAGS: $(inherited) -Xcc -fmodule-map-file=$(PROJECT_DIR)/Generated/leal_ffiFFI.modulemap
  configs:
    Debug:
      LEAL_RUST_PROFILE: debug
    Release:
      LEAL_RUST_PROFILE: release

# Builds from the Xcode IDE (⌘B, ⌘R, ⌘U, Instruments) don't go through
# `just`, so this target runs `just ffi` first. Leal and LealTests both depend
# on it, so it runs once per build and before either compiles. A pre-build
# script on each of them would run `just ffi` twice, in parallel, on the same
# files.
aggregateTargets:
  RustFFI:
    buildScripts:
      - name: Build Rust library and Swift bindings (just ffi)
        # Run every build: Cargo does its own, precise change tracking over
        # every Rust source, and `just ffi` leaves unchanged outputs
        # untouched, so a no-op run costs about a second and triggers no
        # Swift recompile or relink. Listing every `.rs` file as an input
        # here would be incomplete (Cargo.lock, the toolchain, dependencies)
        # and would go stale.
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(PROJECT_DIR)/Generated/leal_ffi.swift
          - $(PROJECT_DIR)/Generated/leal_ffiFFI.h
          - $(PROJECT_DIR)/Generated/leal_ffiFFI.modulemap
          - $(PROJECT_DIR)/../target/universal/$(LEAL_RUST_PROFILE)/libleal_ffi.a
        script: |
          # The `just` recipes run `just ffi` themselves and then call
          # xcodebuild with LEAL_FFI_PREBUILT=1 in the environment (which
          # scripts inherit), so `just app` doesn't build the library twice.
          if [ "${LEAL_FFI_PREBUILT:-}" = 1 ]; then
            echo "just ffi already ran (building from just); skipping"
            exit 0
          fi
          # Xcode runs scripts with a minimal PATH, without Homebrew (just)
          # or rustup (cargo).
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:$PATH"
          cd "$PROJECT_DIR/.."
          just ffi "$LEAL_RUST_PROFILE"
    settings:
      base:
        # Script sandboxing only lets a script touch its declared inputs and
        # outputs. Cargo reads the whole workspace and writes to target/ and
        # ~/.cargo, which can't be declared, so this one target opts out.
        # Every other target keeps the project-wide YES.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Leal:
    type: application
    platform: macOS
    dependencies:
      - target: RustFFI
    sources:
      - path: Sources
      # Generated by `just ffi` (see the comment at the top). `optional` lets
      # the project be generated before the file exists, as in a fresh clone
      # opened in Xcode; the RustFFI target creates it before compiling.
      - path: Generated/leal_ffi.swift
        optional: true
    settings:
      base:
        PRODUCT_NAME: Leal
        PRODUCT_BUNDLE_IDENTIFIER: io.github.robhaswell.leal
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO

  # Unit tests that call Rust through the generated bindings. They compile the
  # bindings themselves and link the library, so they run without launching
  # the app.
  LealTests:
    type: bundle.unit-test
    platform: macOS
    dependencies:
      - target: RustFFI
    sources:
      - path: Tests
      - path: Generated/leal_ffi.swift
        optional: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.robhaswell.leal.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Leal:
    build:
      targets:
        Leal: all
        LealTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LealTests
    archive:
      config: Release
