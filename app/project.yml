# XcodeGen spec for Leal.app. `just xcodeproj` (and `just app`, `just run`,
# `just app-test`) generate app/Leal.xcodeproj from this file. The project is
# git-ignored: edit this file, not the project.
#
# The Rust side comes from `just ffi`. The `just` recipes run it before
# xcodebuild; builds from the Xcode IDE run it through the RustFFI target
# below. It produces:
#   - target/universal/<profile>/libleal_ffi.a  universal static library
#   - app/Generated/leal_ffi.swift              Swift bindings
#   - app/Generated/leal_ffiFFI.h               C header for the library
#   - app/Generated/leal_ffiFFI.modulemap       Clang module `leal_ffiFFI`
# See docs/tasks/0.3.md for how these fit together.

name: Leal

options:
  bundleIdPrefix: io.github.robhaswell
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true

settings:
  base:
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Zero warnings. The `just` recipes also fail on linker warnings.
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    # Ad hoc signing ("-"): the app runs on this Mac without an Apple
    # Developer account. Developer ID signing arrives with PLAN 4.5.
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

    # --- The Rust library ---------------------------------------------------
    # Only the LealFFI framework links libleal_ffi.a (see its target). This
    # flag is project-wide because the generated Swift file does `import
    # leal_ffiFFI`, a Clang module for the C header, and every module that
    # imports LealFFI needs to find it too. Point Clang at its module map
    # directly, so no renaming or bridging header is needed.
    OTHER_SWIFT_FLAGS: $(inherited) -Xcc -fmodule-map-file=$(PROJECT_DIR)/Generated/leal_ffiFFI.modulemap
  configs:
    Debug:
      LEAL_RUST_PROFILE: debug
    Release:
      LEAL_RUST_PROFILE: release

# Builds from the Xcode IDE (⌘B, ⌘R, ⌘U, Instruments) don't go through
# `just`, so this target runs `just ffi` first. LealFFI depends on it, so it
# runs once per build and before anything compiles. A pre-build script on
# each target would run `just ffi` several times, in parallel, on the same
# files.
aggregateTargets:
  RustFFI:
    buildScripts:
      - name: Build Rust library and Swift bindings (just ffi)
        # Run every build: Cargo does its own, precise change tracking over
        # every Rust source, and `just ffi` leaves unchanged outputs
        # untouched, so a no-op run costs about a second and triggers no
        # Swift recompile or relink. Listing every `.rs` file as an input
        # here would be incomplete (Cargo.lock, the toolchain, dependencies)
        # and would go stale.
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(PROJECT_DIR)/Generated/leal_ffi.swift
          - $(PROJECT_DIR)/Generated/leal_ffiFFI.h
          - $(PROJECT_DIR)/Generated/leal_ffiFFI.modulemap
          - $(PROJECT_DIR)/../target/universal/$(LEAL_RUST_PROFILE)/libleal_ffi.a
        script: |
          # The `just` recipes run `just ffi` themselves and then call
          # xcodebuild with LEAL_FFI_PREBUILT=1 in the environment (which
          # scripts inherit), so `just app` doesn't build the library twice.
          if [ "${LEAL_FFI_PREBUILT:-}" = 1 ]; then
            echo "just ffi already ran (building from just); skipping"
            exit 0
          fi
          # Xcode runs scripts with a minimal PATH, without Homebrew (just)
          # or rustup (cargo).
          export PATH="/opt/homebrew/bin:/usr/local/bin:$HOME/.cargo/bin:$PATH"
          cd "$PROJECT_DIR/.."
          just ffi "$LEAL_RUST_PROFILE"
    settings:
      base:
        # Script sandboxing only lets a script touch its declared inputs and
        # outputs. Cargo reads the whole workspace and writes to target/ and
        # ~/.cargo, which can't be declared, so this one target opts out.
        # Every other target keeps the project-wide YES.
        ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  # The Swift bindings and the Rust core, as one framework embedded in
  # Leal.app. This is the only target that compiles Generated/leal_ffi.swift
  # and links libleal_ffi.a; everything else does `import LealFFI`. So a test
  # bundle hosted in the app (for NSDocument tests, task 1.6) shares the
  # app's single copy of the bindings and the Rust core, instead of defining
  # every binding twice ("ambiguous use of 'inspectFile(path:)'") or loading a
  # second Rust core with its own statics.
  LealFFI:
    type: framework
    platform: macOS
    dependencies:
      - target: RustFFI
    sources:
      # Generated by `just ffi` (see the comment at the top). `optional` lets
      # the project be generated before the file exists, as in a fresh clone
      # opened in Xcode; the RustFFI target creates it before compiling.
      - path: Generated/leal_ffi.swift
        optional: true
    settings:
      base:
        PRODUCT_NAME: LealFFI
        PRODUCT_BUNDLE_IDENTIFIER: io.github.robhaswell.leal.ffi
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        # Link target/universal/<profile>/libleal_ffi.a. There is only a `.a`
        # in that directory, so `-l` can't pick up a dylib by accident. The
        # linker records the files it read and Xcode relinks when they change.
        LEAL_FFI_LIBRARY_DIR: $(PROJECT_DIR)/../target/universal/$(LEAL_RUST_PROFILE)
        LIBRARY_SEARCH_PATHS: $(inherited) $(LEAL_FFI_LIBRARY_DIR)
        # Export only what Swift needs: hide the Rust-mangled symbols (`_R...`
        # v0 and `_ZN...` legacy mangling; one more underscore in Mach-O)
        # that the static library brings in. The UniFFI C functions
        # (`uniffi_*`, `ffi_leal_ffi_*`) and the Swift module's symbols stay
        # exported. Without this the framework exported about 1,900 symbols
        # and the Release build was 3.2 MB.
        OTHER_LDFLAGS: $(inherited) -lleal_ffi -Wl,-unexported_symbol,__R* -Wl,-unexported_symbol,__ZN*

  Leal:
    type: application
    platform: macOS
    dependencies:
      # Linked and embedded in Contents/Frameworks.
      - target: LealFFI
    sources:
      - path: Sources
      # User-facing strings (DESIGN §4.4), English only for v1.
      - path: Resources/Localizable.xcstrings
    settings:
      base:
        PRODUCT_NAME: Leal
        PRODUCT_BUNDLE_IDENTIFIER: io.github.robhaswell.leal
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # Extract `String(localized:)` keys at build time, so Xcode can keep
        # Resources/Localizable.xcstrings in step with the code.
        SWIFT_EMIT_LOC_STRINGS: YES
        # The App Sandbox is on from phase 1 (DESIGN §4.3, PLAN 1.6): Leal
        # reads only files the user opened (user-selected read-write) and
        # writes temporary files only in its container or the item
        # replacement folders Foundation gives it. See Leal.entitlements.
        CODE_SIGN_ENTITLEMENTS: Resources/Leal.entitlements
        # The hardened runtime goes on with Developer ID signing and
        # notarization (PLAN 4.5); see docs/tasks/1.6.md.
        ENABLE_HARDENED_RUNTIME: NO

  # Unit tests that call Rust through the generated bindings. They link the
  # LealFFI framework, not the app, so they run without launching the app.
  # Tests that need the app's own types (`@testable import Leal`) are in
  # LealAppTests, below.
  LealTests:
    type: bundle.unit-test
    platform: macOS
    dependencies:
      - target: LealFFI
    sources:
      - path: Tests
      # App code with no AppKit state, compiled into this bundle too so the
      # tests can check it against real errors from Rust. This bundle doesn't
      # import the app module, so the two copies never meet.
      - path: Sources/Document/OpenErrorText.swift
      - path: Sources/Document/TemporaryFolders.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.robhaswell.leal.tests
        GENERATE_INFOPLIST_FILE: YES

  # Tests hosted in Leal.app (task 1.6): the NSDocument, the grid and the
  # window, with `@testable import Leal`. The bundle is loaded into the
  # running app, so it shares the app's LealFFI framework (one copy of the
  # bindings and of the Rust core) and has no bindings or Rust of its own.
  # The app opens no window when it is a test host (see AppDelegate).
  LealAppTests:
    type: bundle.unit-test
    platform: macOS
    dependencies:
      - target: Leal
      - target: LealFFI
    sources:
      - path: AppTests
      # The diagnostics corpus (tests/corpus/README.md), copied into the
      # test bundle as a folder: the sandboxed host can read its own
      # bundle, not the repository (task 1.7's banner tests).
      - path: ../tests/corpus/diagnostics
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.robhaswell.leal.apptests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Leal.app/Contents/MacOS/Leal
        BUNDLE_LOADER: $(TEST_HOST)
        # The net under the tests that stub questions (NoRealUI).
        INFOPLIST_KEY_NSPrincipalClass: LealAppTestsPrincipal

schemes:
  Leal:
    build:
      targets:
        Leal: all
        LealTests: [test]
        LealAppTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      # Don't reopen windows from an earlier run of the test host.
      commandLineArguments:
        "-ApplePersistenceIgnoreState YES": true
      # Which checkout's disk-image helper serves RemovableDriveTests: the
      # helper and the tests both key their folder on this path.
      environmentVariables:
        LEAL_DISK_IMAGE_CHECKOUT: $(PROJECT_DIR)
      # The hosted RemovableDriveTests need disk images, which the sandboxed
      # test host can't attach: this helper attaches them from outside the
      # sandbox while the tests run, and detaches them all at the end (see
      # the script, cons-12 in the phase 1 review). Its log is
      # build/disk-image-helper/helper.log.
      preActions:
        - name: Start the disk-image helper
          settingsTarget: LealAppTests
          script: |
            "$PROJECT_DIR/Scripts/disk-image-helper.sh" start
      postActions:
        - name: Stop the disk-image helper
          settingsTarget: LealAppTests
          script: |
            "$PROJECT_DIR/Scripts/disk-image-helper.sh" stop
      targets:
        - LealTests
        - LealAppTests
    archive:
      config: Release
